name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm derives the version from tags
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU torch and the package
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[full]" pytest
      - name: Fast tests
        run: pytest tests -m "not slow" -q

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Generator tests (mocked runtime)
        run: npm run test:mock

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    # Reports findings without blocking until the existing backlog is cleaned up.
    # Flip to `false` once `ruff check src tests onnx_export` is green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check --output-format github src tests onnx_export
