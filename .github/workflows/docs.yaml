name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs_dev/**"
      - ".github/workflows/docs.yaml"
  pull_request:
    paths:
      - "docs_dev/**"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install mkdocs-material
      - name: Build (strict — fails on broken links)
        # -d docs is relative to the repo root (cwd after checkout), not docs_dev/
        run: mkdocs build --strict -f docs_dev/mkdocs.yml -d docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Publish to GitHub Pages
    # Build runs on PRs as a check; only pushes to main are published.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
